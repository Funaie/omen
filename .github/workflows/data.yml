name: Opdater raiddata

# Raidet er torsdag 20:30-23:30 servertid (CEST). Vi henter fredag morgen,
# saa loggen er faerdigbehandlet hos WarcraftLogs, naar vi spoerger.
# Cron i GitHub Actions koerer altid i UTC — 05:00 UTC = 07:00 dansk sommertid.
on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:        # saa den kan koeres i haanden, naar noget skal rettes

# Jobbet skriver data.json tilbage til repoet, og det kraever skriveadgang.
permissions:
  contents: write

concurrency:
  group: opdater-raiddata
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Hent fra WarcraftLogs
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python scripts/fetch_data.py

      - name: Commit hvis tallene har flyttet sig
        run: |
          if git diff --quiet -- site/data.json; then
            echo "Ingen aendringer i data.json — intet at committe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "Data: opdateret $(date -u +%d-%m-%Y)"
          git push
